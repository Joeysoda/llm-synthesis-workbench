[project]
name = "llm-synthesis-workbench"
version = "0.1.0"
description = "Local Agent OS compatible workbench for Easy Dataset, Synthetic Data Kit, and SynLogic."
requires-python = ">=3.12"
dependencies = [
  "cleanlab[datalab]==2.9.0",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.0,<1",
  "pydantic>=2.11.0,<3",
  "pyyaml>=6.0.2,<7",
  "python-docx>=1.2.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.1.0,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["gateway"]
testpaths = ["tests"]
asyncio_mode = "auto"
